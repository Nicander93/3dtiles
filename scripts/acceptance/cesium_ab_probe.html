<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GeoForge Cesium A/B probe</title>
  <script>window.CESIUM_BASE_URL = '/cesium/';</script>
  <script src="/cesium/Cesium.js"></script>
  <link href="/cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #c { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #hud { position:absolute; left:8px; top:8px; z-index:2; color:#cfe; font:12px monospace;
      background:rgba(0,0,0,.7); padding:8px; max-width:480px; }
  </style>
</head>
<body>
  <div id="hud">GeoForge A/B probe…</div>
  <div id="c"></div>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const tilesetUrl = params.get('tileset');
      const label = params.get('label') || 'run';
      const rangeMul = Number(params.get('range') || '40');
      const sse = Number(params.get('sse') || '16');
      const settleMs = Number(params.get('settleMs') || '8000');
      const hud = document.getElementById('hud');

      window.__GEOFORGE_AB__ = {
        ready: false,
        label,
        tilesetUrl,
        rangeMul,
        sse,
        error: null,
      };

      if (!tilesetUrl) {
        window.__GEOFORGE_AB__.error = 'missing ?tileset=';
        hud.textContent = window.__GEOFORGE_AB__.error;
        return;
      }

      Cesium.Ion.defaultAccessToken = undefined;
      const viewer = new Cesium.Viewer('c', {
        animation: false,
        timeline: false,
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
        imageryProvider: false,
        terrainProvider: undefined,
        requestRenderMode: false,
      });
      viewer.scene.globe.show = false;
      viewer.scene.skyAtmosphere.show = false;
      viewer.scene.fog.enabled = false;
      viewer.scene.sun.show = false;
      viewer.scene.moon.show = false;
      viewer.scene.skyBox.show = false;
      if (viewer.scene.globe) viewer.scene.globe.baseColor = Cesium.Color.BLACK;

      const t0 = performance.now();
      let firstTileAt = null;
      const resourceStarts = new Map();

      // Resource Timing for transferred bytes / request counts (same-origin tiles).
      function collectResourceStats() {
        const entries = performance.getEntriesByType('resource');
        let bytes = 0;
        let http = 0;
        let failed = 0;
        let tileish = 0;
        for (const e of entries) {
          http += 1;
          const transfer = e.transferSize || 0;
          const encoded = e.encodedBodySize || 0;
          bytes += transfer || encoded;
          const name = e.name || '';
          if (/\.(b3dm|i3dm|pnts|cmpt|glb|gltf|json|ktx2)(\?|$)/i.test(name)) tileish += 1;
        }
        return { httpRequestCount: http, contentRequestCount: tileish, bytesTransferred: bytes, failedRequestCount: failed };
      }

      Cesium.Cesium3DTileset.fromUrl(tilesetUrl, {
        maximumScreenSpaceError: sse,
      }).then(async (tileset) => {
        viewer.scene.primitives.add(tileset);
        tileset.allTilesLoaded.addEventListener(() => {
          if (firstTileAt == null) firstTileAt = performance.now() - t0;
        });
        tileset.tileLoad.addEventListener(() => {
          if (firstTileAt == null) firstTileAt = performance.now() - t0;
        });

        await viewer.zoomTo(tileset);
        const bs = tileset.boundingSphere;
        const range = Math.max(bs.radius * rangeMul, 50);
        viewer.camera.viewBoundingSphere(
          bs,
          new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-35), range)
        );
        viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);

        const waitStart = performance.now();
        await new Promise((resolve) => {
          const tick = () => {
            if (tileset.tilesLoaded || performance.now() - waitStart > settleMs) resolve();
            else requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        });
        // Extra settle for network/resource timing to flush
        await new Promise((r) => setTimeout(r, 1500));
        viewer.scene.render();

        const carto = Cesium.Cartographic.fromCartesian(bs.center);
        const stats = collectResourceStats();
        let selectedTiles = null;
        try {
          selectedTiles = tileset.statistics ? {
            numberOfTilesTotal: tileset.statistics.numberOfTilesTotal,
            numberOfTilesWithContentReady: tileset.statistics.numberOfTilesWithContentReady,
            numberOfPendingRequests: tileset.statistics.numberOfPendingRequests,
            numberOfTilesProcessing: tileset.statistics.numberOfTilesProcessing,
          } : null;
        } catch (_) { selectedTiles = null; }

        const timeToOverviewReady = performance.now() - t0;
        window.__GEOFORGE_AB__ = {
          ready: true,
          label,
          tilesetUrl,
          rangeMul,
          sse,
          error: null,
          timeToFirstTileMs: firstTileAt,
          timeToOverviewReadyMs: timeToOverviewReady,
          tilesLoaded: !!tileset.tilesLoaded,
          boundingSphere: {
            radius: bs.radius,
            lon: Cesium.Math.toDegrees(carto.longitude),
            lat: Cesium.Math.toDegrees(carto.latitude),
            height: carto.height,
          },
          ...stats,
          cesiumStatistics: selectedTiles,
          capturedAt: new Date().toISOString(),
        };
        hud.textContent = JSON.stringify(window.__GEOFORGE_AB__, null, 2);
      }).catch((err) => {
        window.__GEOFORGE_AB__ = {
          ready: true,
          label,
          tilesetUrl,
          error: (err && err.message) ? err.message : String(err),
        };
        hud.textContent = 'ERROR ' + window.__GEOFORGE_AB__.error;
      });
    })();
  </script>
</body>
</html>
