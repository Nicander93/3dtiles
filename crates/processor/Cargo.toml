[package]
name = "processor"
version = "0.1.0"
edition = "2021"
description = "GeoForge V1 task processor — stable boundary between Desktop and processing cores"
authors = ["GeoForge"]

[[bin]]
name = "processor"
path = "src/main.rs"

[lib]
name = "processor"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
ctrlc = "3.4"
thiserror = "1"
chrono = { version = "0.4", features = ["clock"] }
