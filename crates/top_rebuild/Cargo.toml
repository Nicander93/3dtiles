[package]
name = "top_rebuild"
version = "0.1.0"
edition = "2021"
description = "TopRebuild core — Proxy HLOD Phases 5–10 (release CLI + Processor default)"
license = "Apache-2.0"
authors = ["GeoForge"]

[lib]
name = "top_rebuild"
path = "src/lib.rs"

[[bin]]
name = "top_rebuild"
path = "src/bin/top_rebuild.rs"

[[bin]]
name = "top_rebuild_debug"
path = "src/bin/top_rebuild_debug.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1"
regex = "1"
clap = { version = "4.5", features = ["derive"] }
meshopt = "0.6"
gltf = { version = "1.4", features = ["utils"], default-features = false }
byteorder = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
