<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OSGB → 3D Tiles 预览</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    html, body, #cesiumContainer { width:100%; height:100%; margin:0; overflow:hidden; }
    #hud {
      position:absolute; left:12px; top:12px; z-index:10;
      background:rgba(20,24,32,.88); color:#e8eefc; padding:12px 14px;
      border-radius:10px; font:13px/1.45 system-ui,sans-serif; max-width:360px;
    }
    #hud h1 { font-size:14px; margin:0 0 6px; }
    #hud code { background:#2a3142; padding:1px 5px; border-radius:4px; }
    a { color:#8ec5ff; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>公开样例 OSGBny → rebuild-top 结果</h1>
    <div>数据来源：fanvanzh/3dtiles issue #336 附件<br/>
    加载：<code>tiles/tileset.json</code></div>
  <div style="margin-top:8px"><a href="./osgb.html" style="color:#8ec5ff">OSGB 源模型预览</a></div></div>
  <div id="cesiumContainer"></div>
  <script>
    Cesium.Ion.defaultAccessToken = undefined;
    const viewer = new Cesium.Viewer('cesiumContainer', {
      animation: false,
      timeline: false,
      baseLayerPicker: true,
      geocoder: false,
      homeButton: true,
      sceneModePicker: true,
      navigationHelpButton: false,
      fullscreenButton: true,
      imageryProvider: false,
      terrainProvider: undefined,
    });
    // OSM imagery without Ion
    viewer.imageryLayers.removeAll();
    viewer.imageryLayers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider({
        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        credit: '© OpenStreetMap'
      })
    );
    (async () => {
      const tileset = await Cesium.Cesium3DTileset.fromUrl('./tiles_rebuild/tileset.json');
      viewer.scene.primitives.add(tileset);
      await viewer.zoomTo(tileset);
      console.log('tileset loaded', tileset.boundingSphere);
    })().catch(err => {
      console.error(err);
      document.getElementById('hud').innerHTML += '<div style="color:#ff8b8b;margin-top:8px">加载失败: ' + err + '</div>';
    });
  </script>
</body>
</html>
