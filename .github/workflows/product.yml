name: Product Core

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build product crates (no OSG/GDAL)
        run: cargo build
      - name: Test protocol + processor
        run: |
          cargo test -p geoforge-protocol
          cargo test -p processor --lib
      - name: Processor capabilities smoke
        run: cargo run -p processor --quiet -- capabilities --json

  converter:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[converter]')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Placeholder — full converter build uses engines/3dtiles-converter + vcpkg
        run: |
          Write-Host "Enable manually or with [converter] commit marker"
          if (Test-Path engines/3dtiles-converter/Cargo.toml) {
            Write-Host "Engine crate present"
          }
