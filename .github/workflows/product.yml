name: Product Core

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build product crates (no OSG/GDAL)
        run: cargo build
      - name: Test protocol + processor
        run: |
          cargo test -p geoforge-protocol
          cargo test -p processor --lib
      - name: Processor capabilities smoke
        run: cargo run -p processor --quiet -- capabilities --json
