# Legacy multi-OS `_3dtile` packaging removed with engines/.
# Windows product installer: see release-windows.yml (tag v*.*.*).
name: Release (legacy disabled)

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Legacy engine release workflow is disabled; use Release Windows"
        required: false
        default: "noop"

permissions:
  contents: read

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Point to Release Windows
        run: |
          echo "This workflow no longer packages engines/_3dtile."
          echo "Push a v*.*.* tag to run .github/workflows/release-windows.yml"
          exit 0
