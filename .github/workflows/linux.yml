name: Ubuntu

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build product crates (no OSG/GDAL)
        run: cargo build
      - name: Test protocol + processor
        run: |
          cargo test -p geoforge-protocol
          cargo test -p processor --lib
      - name: Processor capabilities smoke
        run: cargo run -p processor --quiet -- capabilities --json
      - name: Run D0 acceptance tests
        run: |
          cargo build --release -p processor
          cd docs/acceptance/v1-convergence
          ./scripts/run-acceptance.sh --level d0
